<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cloudflarepay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        .logo span {
            color: #f6821f;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }
        input:focus {
            border-color: #f6821f;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #f6821f, #f59e0b);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button:hover {
            box-shadow: 0 8px 20px rgba(246, 130, 31, 0.4);
        }
        button:active {
            transform: scale(0.97);
        }
        .error {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Cloudflare<span>Pay</span></div>
        <div class="subtitle">请输入你的 tag 以继续</div>
        <input type="text" id="tagInput" placeholder="输入 tag..." autocomplete="off">
        <button id="submitBtn">跳转</button>
        <div class="error" id="errorMsg">请输入 tag 后再跳转</div>
    </div>

    <script>
        function go() {
            const input = document.getElementById('tagInput');
            const error = document.getElementById('errorMsg');
            const tag = input.value.trim();

            if (!tag) {
                error.style.display = 'block';
                input.focus();
                return;
            }

            error.style.display = 'none';
            window.location.href = 'https://cloudflare.pay/already-claimed?tag=' + encodeURIComponent(tag);
        }

        document.getElementById('submitBtn').addEventListener('click', go);
        document.getElementById('tagInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                go();
            }
        });
    </script>
</body>
</html>
